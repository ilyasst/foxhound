[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foxhound"
version = "0.1.0"
description = "Task lifecycle and execution service."
requires-python = ">=3.11"

[project.scripts]
foxhound-task-cards = "foxhound.task_card_server:main"
foxhound-database = "foxhound.database_lifecycle:main"
foxhound-execution-runner = "foxhound.execution_runner:main"
foxhound-task-worker = "foxhound.execution_worker:main"
foxhound-task-bootstrap = "foxhound.task_bootstrap:main"
foxhound-execution-schedule = "foxhound.execution_schedule:main"
foxhound-execution-card-requeue = "foxhound.execution_card_requeue:main"
foxhound-native-intake = "foxhound.native_intake:main"
foxhound-scheduler-cutover = "foxhound.scheduler_cutover:main"
foxhound-agent-profiles = "foxhound.agent_profiles:main"
foxhound-agent-profile-store = "foxhound.profile_store:main"
foxhound-deployment-config = "foxhound.deployment_config:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"foxhound.contracts" = ["schemas/*.json"]

[tool.pytest.ini_options]
# Repo root ("."), not just "src", must be on sys.path: tools/ (the
# public-diff guard) lives at the repo root, not under src/, and its test
# imports it as `from tools.check_public_diff import findings`. Without this,
# running plain `pytest` from the repo root fails that import even though the
# documented `PYTHONPATH=src python3 -m unittest discover -s tests -v`
# happens to work already (python -m unittest puts the current directory on
# sys.path automatically; a bare `pytest` invocation does not). This makes
# both invocations work without a PYTHONPATH environment variable.
pythonpath = ["src", "."]
testpaths = ["tests"]
