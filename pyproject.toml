[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foxhound"
version = "0.1.0"
description = "Task lifecycle and execution service."
requires-python = ">=3.11"

[project.scripts]
foxhound-task-cards = "foxhound.task_card_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"foxhound.contracts" = ["schemas/*.json"]
